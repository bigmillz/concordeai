# ollama1: br0 bridges the two wired ports so the Raspberry Pi on enp38s0
# stays on the home LAN. Bridged frames must not pass through iptables
# (ufw's FORWARD policy is deny), so bridge netfilter stays off. The keys
# exist only while br_netfilter is loaded (the leading '-' makes a missing
# key harmless); systemd re-applies them if the module loads later.
-net.bridge.bridge-nf-call-iptables = 0
-net.bridge.bridge-nf-call-ip6tables = 0
-net.bridge.bridge-nf-call-arptables = 0
