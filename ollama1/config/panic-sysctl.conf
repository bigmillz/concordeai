# ollama1 panic-reboot (6b524), installed as /etc/ollama1/panic-sysctl.conf by tools/install-watchdogs.sh.
#
# NOT a file in /etc/sysctl.d, on purpose: systemd-sysctl applies that folder early in every boot, before anything
# can look at how the last boots went. Only ollama1-bootguard applies this file, once per boot, and only when the
# box is not in a boot loop (3 or more boots within 60 minutes: then it writes the values from before the install
# instead, so the server stays up and reachable). After an edit: sudo systemctl restart ollama1-bootguard
# Remove a line (or set it to 0) to keep that setting as it was before the install.

# A panic reboots the machine after 10 s instead of leaving it frozen for ever (the kernel's default, 0). 10 s lets
# the panic text reach the console and pstore. This is what makes every line below end in a reboot.
kernel.panic = 10

# A CPU stuck in the kernel for 20 s (twice watchdog_thresh) without scheduling: a driver spinning, as the NVIDIA
# driver can after a failed GSP reset. Normally only a "soft lockup" warning, and the machine limps on wedged.
kernel.softlockup_panic = 1

# A CPU stuck with interrupts off, seen by the NMI watchdog. ollama1-bootguard sets it only when
# /proc/sys/kernel/nmi_watchdog is 1; otherwise there is nothing to detect it and it is left alone.
kernel.hardlockup_panic = 1

# An oops (a kernel bug, usually in a driver) panics instead of killing one process and leaving a half-broken
# kernel. The RISK: a driver that oopses at every boot (the NVIDIA module on a bad day) then reboots every boot;
# the boot-loop guard stops that after 3 boots within 60 minutes. Set it to 0 to keep oopses survivable.
kernel.panic_on_oops = 1

# A task stuck in uninterruptible sleep (D state) for hung_task_timeout_secs panics. A GPU that stopped answering
# leaves nvidia-smi and Ollama stuck like that; so does a dying disk. 600 s (not the usual 120) so that a slow or
# busy disk, a big copy or a long fsync never panics the box: only something stuck for 10 whole minutes does.
kernel.hung_task_panic = 1
kernel.hung_task_timeout_secs = 600
