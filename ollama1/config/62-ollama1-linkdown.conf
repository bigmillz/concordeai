# ollama1: with the network cable out, traffic goes over the Wi-Fi backup (6b473).
# netplan configures the bridge br0 so that it keeps its address and its DHCP
# routes (metric 100) while the cable is out; the Wi-Fi card's routes are metric
# 600. The kernel kept choosing the lower-metric routes through the dead bridge,
# so replies, and the server's own outbound traffic (the Cloudflare tunnel
# included), went nowhere: the server was on but unreachable at both addresses.
# With these keys the kernel skips any route whose link has lost its carrier, so
# the next route (the Wi-Fi card's) is used. With the cable in nothing changes:
# the wired route is alive and still wins by metric.
# For this key the kernel ORs "all" with a link's own value (IN_DEV_ORCONF for
# IPv4; ip6_ignore_linkdown for IPv6), so "all" covers every link, present or
# future (a bridge that appears later too); no interface name is needed.
# The IPv4 key always exists, so no leading "-": a typo must fail loudly. The
# IPv6 key is missing only when IPv6 is switched off in the kernel, hence "-".
# setup.sh applies this file; so does every boot.
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
-net.ipv6.conf.all.ignore_routes_with_linkdown = 1
