# ollama1: boot waits for ONE working network link (30 s at most), not for every link.
# The stock service waits for all of them, so an unplugged second wired port or a Wi-Fi spare held
# every boot at "Job systemd-networkd-wait-online.service/start running" for 2 minutes.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
