# ollama1: each network card answers ARP only for its own addresses, and asks
# with its own (6b450). Linux's defaults (arp_ignore 0, arp_announce 0) let
# every card answer "who has <address>?" for any address the machine has, so
# with the Wi-Fi backup on (a second card on the same LAN) the Wi-Fi card also
# answered for the wired bridge's address. Whenever its reply landed last in a
# client's ARP cache, that client sent the server's traffic to a Wi-Fi card in
# power save: SSH timed out and ping took hundreds of milliseconds until the
# cache flipped back, minutes later. Now the wired address is answered on the
# wired link only and the Wi-Fi card's own address on the Wi-Fi card only.
# "all": the kernel takes the larger of it and a card's own value for both
# keys, so every card, present or future, is covered without naming one. With
# one card it changes nothing. The keys always exist, so no leading "-": a
# typo must fail loudly. setup.sh applies this file; so does every boot.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
