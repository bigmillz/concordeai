<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ConcordeGo · Field</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Space+Grotesk:wght@200;300;400;500&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#070709;--grid:#16171c;--line:#212329;--text:#efeff0;--dim:#93939c;--faint:#5f5f68;
 --a:#3ddc97;--b:#f5c451;--c:#ff7a59;--f:#ff4d4d;--sweep:#7c6cff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:300 15px/1.5 "Space Grotesk",Helvetica,sans-serif;
 -webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.app{height:100%;display:grid;grid-template-columns:1fr 372px}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{display:none}}

.left{display:flex;flex-direction:column;min-width:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 26px}
.mark{font-family:Michroma,sans-serif;font-size:12px;letter-spacing:.26em;text-transform:uppercase}
.mark b{font-weight:400;color:var(--sweep)}
.q{font-size:12px;color:var(--faint)}

.plot{flex:1;position:relative;margin:4px 26px 0}
canvas{position:absolute;inset:0;width:100%;height:100%}
.axl{position:absolute;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.axl.x{bottom:-2px;left:50%;transform:translateX(-50%)}
.axl.y{top:-16px;left:0}
.dot{position:absolute;width:13px;height:13px;border-radius:50%;transform:translate(-50%,-50%);
 cursor:pointer;transition:transform .18s,box-shadow .18s;border:1.5px solid rgba(7,7,9,.85)}
.dot:hover,.dot.sel{transform:translate(-50%,-50%) scale(1.75);z-index:3}
.dot.sel{box-shadow:0 0 0 2px var(--text),0 0 26px currentColor}
.dot.dim{opacity:.22}

.ctrl{padding:20px 26px 26px}
.tlabel{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.2em;
 text-transform:uppercase;color:var(--faint);margin-bottom:11px}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:2px;border-radius:2px;
 background:linear-gradient(90deg,var(--a),var(--b),var(--sweep));outline:none}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
 background:var(--text);cursor:grab;box-shadow:0 0 0 5px rgba(124,108,255,.18)}
.slider::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--text);cursor:grab}
.reading{margin-top:13px;font-size:12.5px;color:var(--dim)}
.reading b{color:var(--text);font-weight:400}

.side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
 background:linear-gradient(180deg,rgba(124,108,255,.05),transparent 240px)}
.side .head{padding:22px 24px 16px;border-bottom:1px solid var(--line)}
.side .grade{font-family:Michroma,sans-serif;font-size:38px;letter-spacing:.01em;line-height:1}
.side h2{font-size:20px;font-weight:300;letter-spacing:-.015em;margin-top:12px}
.side .rt{font-size:11.5px;color:var(--faint);letter-spacing:.09em;margin-top:6px;text-transform:uppercase}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.kv div{background:var(--bg);padding:13px 24px}
.kv .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.kv .v{font-size:16px}
.side .body{flex:1;overflow-y:auto;padding:18px 24px 30px}
.side h5{font:400 9.5px/1 "Space Grotesk",sans-serif;letter-spacing:.22em;text-transform:uppercase;
 color:var(--faint);margin:6px 0 10px}
.ln{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid rgba(33,35,41,.7);font-size:13px}
.ln em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:3px;line-height:1.45}
.ln.d span:last-child{color:var(--c)}.ln.c span:last-child{color:var(--a)}
.ln.t{border-bottom:0;border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:15px}
.empty{padding:60px 24px;color:var(--faint);font-size:13px;text-align:center;line-height:1.7}
.tip{position:fixed;z-index:9;pointer-events:none;background:#131418;border:1px solid #2a2c33;
 border-radius:7px;padding:8px 11px;font-size:11.5px;opacity:0;transition:opacity .12s;white-space:nowrap;
 box-shadow:0 12px 34px rgba(0,0,0,.65)}
</style></head><body>
<div class="app">
  <div class="left">
    <div class="bar"><div class="mark">Concorde<b>Go</b></div><div class="q" id="q"></div></div>
    <div class="plot" id="plot" style="margin-top:22px">
      <canvas id="cv"></canvas>
      <div class="axl x">door to door &nbsp;→</div>
      <div class="axl y">↑ what it really costs</div>
    </div>
    <div class="ctrl">
      <div class="tlabel"><span>Cheap · your time is worth little</span>
        <span>Luxury · your time is worth a lot</span></div>
      <input type="range" class="slider" id="sl" min="0" max="3" step="1" value="0">
      <div class="reading" id="reading"></div>
    </div>
  </div>
  <aside class="side" id="side"></aside>
</div>
<div class="tip" id="tip"></div>
<script id="d" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("d").textContent);
const money = c => "$" + Math.abs(Math.round(c/100)).toLocaleString();
const hm = m => (m/60|0) + "h " + String(m%60).padStart(2,"0") + "m";
const STOPS=[["cheapest","Cheapest","your time priced at $12/hr — a long layover is a fair trade"],
             ["reference","Neutral","your time at $35/hr — the yardstick every grade is measured on"],
             ["fastest","Fastest","your time at $95/hr — hours cost more than dollars"],
             ["comfort","Luxury","comfort weighted double — a bad cabin costs real money"]];
let si = 0, sel = null;
const tone = g => "F".includes(g[0])?"#ff4d4d":"CD".includes(g[0])?"#ff7a59":g[0]==="B"?"#f5c451":"#3ddc97";
document.getElementById("q").textContent =
  D.query.origin.split(",")[0] + " → " + D.query.destination + " · " + D.query.date
  + " · " + D.query.total_found + " itineraries";

function rows(){
  // The field's job is the trade-off SURFACE, so it plots every itinerary we
  // have rather than one target's top slice. The slider changes the sweep line
  // and the ordering, not which flights exist.
  const merged = new Map();
  for (const set of Object.values(D.results)) for (const r of set) merged.set(r.id, r);
  const ranked = D.results[STOPS[si][0]] || [];
  const order = new Map(ranked.map((r,n) => [r.id, n]));
  return [...merged.values()].sort(
    (a,b) => (order.has(a.id)?order.get(a.id):999) - (order.has(b.id)?order.get(b.id):999));
}

function draw(){
  const R = rows(), plot = document.getElementById("plot");
  const w = plot.clientWidth, h = plot.clientHeight;
  const cv = document.getElementById("cv"), dpr = devicePixelRatio || 1;
  cv.width = w*dpr; cv.height = h*dpr;
  const g = cv.getContext("2d"); g.scale(dpr,dpr); g.clearRect(0,0,w,h);

  const pad = {l:62,r:26,t:16,b:40};
  const xs = R.map(r=>r.door_minutes), ys = R.map(r=>r.effective_cents);
  const x0=Math.min(...xs)*0.92, x1=Math.max(...xs)*1.04;
  const y0=Math.min(...ys)*0.92, y1=Math.max(...ys)*1.05;
  const X = v => pad.l + (v-x0)/(x1-x0) * (w-pad.l-pad.r);
  const Y = v => h-pad.b - (v-y0)/(y1-y0) * (h-pad.t-pad.b);

  g.strokeStyle="#16171c"; g.lineWidth=1; g.font="10px 'IBM Plex Mono',monospace"; g.fillStyle="#5f5f68";
  for(let k=0;k<=4;k++){
    const yv=y0+(y1-y0)*k/4, py=Y(yv);
    g.beginPath(); g.moveTo(pad.l,py); g.lineTo(w-pad.r,py); g.stroke();
    g.fillText(money(yv), 6, py+3);
    const xv=x0+(x1-x0)*k/4, px=X(xv);
    g.beginPath(); g.moveTo(px,pad.t); g.lineTo(px,h-pad.b); g.stroke();
    g.fillText(hm(Math.round(xv)), px-16, h-pad.b+18);
  }
  // par: the fixed yardstick the letters are measured against
  if (D.query.par_cents>y0 && D.query.par_cents<y1){
    const py=Y(D.query.par_cents);
    g.setLineDash([4,5]); g.strokeStyle="rgba(239,239,240,.3)";
    g.beginPath(); g.moveTo(pad.l,py); g.lineTo(w-pad.r,py); g.stroke(); g.setLineDash([]);
    g.fillStyle="rgba(239,239,240,.5)"; g.fillText("par · a clean trip on this route", pad.l+6, py-7);
  }
  // the sweep: the current target's indifference line, best-first
  const best = R.slice().sort((a,b)=>a.effective_cents-b.effective_cents)[0];
  if (best){
    const slope = (y1-y0)/(x1-x0) * [0.18,0.5,1.25,0.8][si];
    g.strokeStyle="rgba(124,108,255,.55)"; g.lineWidth=1.5;
    g.beginPath();
    g.moveTo(X(x0), Y(best.effective_cents - slope*(best.door_minutes-x0)));
    g.lineTo(X(x1), Y(best.effective_cents + slope*(x1-best.door_minutes)));
    g.stroke();
  }

  plot.querySelectorAll(".dot").forEach(n=>n.remove());
  R.forEach((r,n)=>{
    const d=document.createElement("div");
    d.className="dot"+(sel===r.id?" sel":"");
    d.style.left=X(r.door_minutes)+"px"; d.style.top=Y(r.effective_cents)+"px";
    d.style.background=tone(r.grade); d.style.color=tone(r.grade);
    d.dataset.id=r.id;
    d.dataset.tip=`${r.flight} · ${r.grade} · ${money(r.effective_cents)} · ${hm(r.door_minutes)}`;
    plot.appendChild(d);
  });
  document.getElementById("reading").innerHTML =
    `<b>${STOPS[si][1]}</b> — ${STOPS[si][2]}. Best here: <b>${best?best.flight:"—"}</b>
     at ${best?money(best.effective_cents):""} <b>${best?best.grade:""}</b>.
     Moving this re-orders the field; no letter moves.`;
  side();
}
function side(){
  const R = rows(), r = R.find(x=>x.id===sel);
  const el = document.getElementById("side");
  if (!r){ el.innerHTML = `<div class="empty">Every itinerary is a point.<br>
    Left is faster, down is cheaper.<br><br>Colour is the grade, and the grade is a property of
    the flight — it does not move when you drag the target.<br><br>Pick one.</div>`; return; }
  const deb=r.lines.filter(l=>l.code!=="ticket"&&l.cents>0).sort((a,b)=>b.cents-a.cents);
  const cre=r.lines.filter(l=>l.cents<0);
  el.innerHTML = `
    <div class="head"><div class="grade" style="color:${tone(r.grade)}">${r.grade}</div>
      <h2>${r.name.split(" · ")[0]}</h2>
      <div class="rt">${r.flight} · ${r.route.join(" → ")} · ${r.brand}</div></div>
    <div class="kv">
      <div><div class="k">Effective</div><div class="v num">${money(r.effective_cents)}</div></div>
      <div><div class="k">Ticket</div><div class="v num">${money(r.ticket_cents)}</div></div>
      <div><div class="k">Door to door</div><div class="v num">${hm(r.door_minutes)}</div></div>
      <div><div class="k">Stops</div><div class="v">${r.stops||"None"}</div></div>
    </div>
    <div class="body">
      <h5>What it adds</h5>
      ${deb.map(l=>`<div class="ln d"><span>${l.label}${l.evidence?`<em>${l.evidence}</em>`:""}</span>
        <span class="num">−${money(l.cents)}</span></div>`).join("")}
      ${cre.length?`<h5 style="margin-top:20px">What it gives back</h5>`+cre.map(l=>
        `<div class="ln c"><span>${l.label}${l.evidence?`<em>${l.evidence}</em>`:""}</span>
         <span class="num">+${money(-l.cents)}</span></div>`).join(""):""}
      <div class="ln t"><span>What it actually costs you</span>
        <span class="num">${money(r.effective_cents)}</span></div>
    </div>`;
}
const tip=document.getElementById("tip");
document.addEventListener("mousemove",e=>{
  const d=e.target.closest(".dot");
  if(!d){tip.style.opacity=0;return;}
  tip.textContent=d.dataset.tip;tip.style.opacity=1;
  tip.style.left=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-12)+"px";
  tip.style.top=(e.clientY-42)+"px";
});
document.addEventListener("click",e=>{
  const d=e.target.closest(".dot"); if(d){ sel=d.dataset.id; draw(); }
});
document.getElementById("sl").addEventListener("input",e=>{ si=+e.target.value; draw(); });
addEventListener("resize",draw);
draw();
</script></body></html>
