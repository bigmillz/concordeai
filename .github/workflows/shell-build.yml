# The native shell (shell/, Tauri 2) on every desktop target (6b532).
# NOT WIRED TO RELEASES YET: this builds and uploads the bundles as run
# artifacts so the Windows and Linux builds are proven before the shell
# becomes the shipped app (RUST_PLAN.md, step 1 → packaging). The
# Python-app workflow (windows-installer.yml) is untouched.
name: shell-build

on:
  workflow_dispatch:
  push:
    branches: [rust-shell]
    paths:
      - "shell/**"
      - ".github/workflows/shell-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-13
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri

      # Tauri's Linux prerequisites (webkit2gtk 4.1 for Tauri 2)
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev \
            libxdo-dev libayatana-appindicator3-dev

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build
        working-directory: shell/src-tauri
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: shell-${{ matrix.target }}
          path: |
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            shell/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
          if-no-files-found: error
