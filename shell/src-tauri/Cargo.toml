[package]
name = "concordeai-shell"
version = "7.0.0"
description = "ConcordeAI's native window: a Tauri 2 shell around the Python server (step 1 of the Rust move, 6b532)"
authors = ["Patrick Miller"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "ConcordeAI"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["devtools"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
